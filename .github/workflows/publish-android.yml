name: Publish Android SDK

on:
  push:
    branches: [ main ]
    paths:
      - 'sdks/android/**'

permissions:
  contents: write

jobs:
  publish-android:
    # Exclusion logic:
    # 1) Ignore any commit whose message contains a skip-ci marker
    #    ([skip ci], [skip-ci], [skip_ci]), regardless of author.
    # 2) Ignore any commit authored by the Version pusher app, regardless of message.
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[skip_ci]') &&
      !contains(github.actor, 'version-pusher')
    runs-on: ubuntu-latest

    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Create GitHub App token (Version pusher)
        working-directory: sdks/android
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Bump VERSION_NAME based on commit message
        working-directory: sdks/android
        run: |
          set -e

          current_version=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          if [ -z "$current_version" ]; then
            echo "VERSION_NAME not found in gradle.properties"; exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current_version"

          commit_msg="${{ github.event.head_commit.message }}"

          if echo "$commit_msg" | grep -qi '\[major\]'; then
            major=$((major + 1))
            minor=0
            patch=0
          elif echo "$commit_msg" | grep -qi '\[minor\]'; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="${major}.${minor}.${patch}"

          echo "Bumping VERSION_NAME: $current_version -> $new_version"

          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${new_version}/" gradle.properties

          echo "NEW_VERSION=${new_version}" >> "$GITHUB_ENV"

          git config user.name "Version pusher"
          git config user.email "version-pusher[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git commit -am "chore(android): bump version to ${new_version} [skip ci]"
            git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
          fi

      - name: Run tests
        working-directory: sdks/android
        run: ./gradlew test --stacktrace

      - name: Publish to Maven Central (Sonatype S01)
        working-directory: sdks/android
        run: ./gradlew publishToSonatype closeAndReleaseStagingRepository --stacktrace
