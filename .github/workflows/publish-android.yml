name: Publish Android SDK

on:
  push:
    branches: [ main ]
    paths:
      - 'sdks/android/**'

permissions:
  contents: write

jobs:
  publish-android:
    # 1) Skip on [skip ci]. 2) Skip when commit is from Version pusher (only it bumps VERSION_NAME).
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[skip_ci]') &&
      !contains(github.actor, 'version-pusher')
    runs-on: ubuntu-latest

    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout (for local actions)
        uses: actions/checkout@v4

      - name: Version pusher checkout
        id: checkout
        uses: ./.github/actions/version-pusher-checkout

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Read current version from gradle.properties
        id: current
        working-directory: sdks/android
        run: |
          current_version=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          if [ -z "$current_version" ]; then
            echo "VERSION_NAME not found in gradle.properties"
            exit 1
          fi
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: semver
        uses: ./.github/actions/calculate-next-version
        with:
          current_version: ${{ steps.current.outputs.current_version }}
          commit_message: ${{ github.event.head_commit.message }}

      - name: Bump VERSION_NAME and push commit
        working-directory: sdks/android
        env:
          NEW_VERSION: ${{ steps.semver.outputs.next_version }}
          APP_TOKEN: ${{ steps.checkout.outputs.token }}
        run: |
          set -e
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NEW_VERSION}/" gradle.properties
          echo "Bumping VERSION_NAME -> ${NEW_VERSION}"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          git config user.name "Version pusher"
          git config user.email "version-pusher[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add gradle.properties
            git commit -m "chore(android): bump version to ${NEW_VERSION} [skip ci]"
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
          fi

      - name: Run tests
        working-directory: sdks/android
        run: ./gradlew test --stacktrace

      - name: Publish to Maven Central (Central Portal)
        working-directory: sdks/android
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
