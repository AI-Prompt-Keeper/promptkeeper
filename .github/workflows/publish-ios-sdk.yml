name: Publish iOS SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/ios/**'

permissions:
  contents: write

jobs:
  publish:
    # 1) Skip on [skip ci]. 2) Skip when run was triggered by Version pusher (only it pushes tags).
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[skip_ci]') &&
      !contains(github.actor, 'version-pusher')
    runs-on: macos-latest

    steps:
      - name: Checkout (for local actions)
        uses: actions/checkout@v4

      - name: Version pusher checkout
        id: checkout
        uses: ./.github/actions/version-pusher-checkout
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve current version from tags
        id: current
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "current_version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "current_version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: version
        uses: ./.github/actions/calculate-next-version
        with:
          current_version: ${{ steps.current.outputs.current_version }}
          commit_message: ${{ github.event.head_commit.message }}

      - name: Push git tag
        uses: ./.github/actions/push-git-tag
        with:
          version: ${{ steps.version.outputs.next_version }}
          token: ${{ steps.checkout.outputs.token }}

      - name: Build Swift package
        run: |
          cd sdks/ios
          swift build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ steps.checkout.outputs.token }}
        with:
          tag_name: v${{ steps.version.outputs.next_version }}
          name: Release v${{ steps.version.outputs.next_version }}
          generate_release_notes: true
