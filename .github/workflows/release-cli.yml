name: Release CLI

on:
  push:
    branches: [ main ]
    paths:
      - 'cli/**'

permissions:
  contents: write

jobs:
  release-cli:
    # 1) Skip on [skip ci] markers. 2) Skip when commit is from Version pusher (only it pushes tags).
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[skip_ci]') &&
      !contains(github.actor, 'version-pusher')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for local actions)
        uses: actions/checkout@v4

      - name: Version pusher checkout
        id: checkout
        uses: ./.github/actions/version-pusher-checkout

      - name: Resolve current version from tags
        id: current
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "current_version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "current_version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: semver
        uses: ./.github/actions/calculate-next-version
        with:
          current_version: ${{ steps.current.outputs.current_version }}
          commit_message: ${{ github.event.head_commit.message }}

      - name: Push git tag
        uses: ./.github/actions/push-git-tag
        with:
          version: ${{ steps.semver.outputs.next_version }}
          token: ${{ steps.checkout.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic
          echo "/snap/bin" >> $GITHUB_PATH

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.checkout.outputs.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prke-dist-v${{ steps.semver.outputs.next_version }}
          path: dist/**
